<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Ritwik's collection of websites and projects.">
  <title>Ritwik | Websites & Projects</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #edf2fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 75% 0%, rgb(39 86 136 / 25%), transparent 42rem),
        #101827;
    }

    a { color: inherit; }

    .page {
      width: min(100% - 2.5rem, 960px);
      margin: 0 auto;
      padding: 5.5rem 0 2rem;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #75d6c3;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(2.7rem, 8vw, 5.4rem);
      letter-spacing: -.065em;
      line-height: 1;
    }

    .intro {
      max-width: 570px;
      margin: 1.4rem 0 3.5rem;
      color: #aab8ca;
      font-size: 1.1rem;
      line-height: 1.75;
    }

    .section-heading {
      margin: 0 0 1rem;
      color: #d7e0ed;
      font-size: 1.05rem;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 1rem;
    }

    .project {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      align-items: flex-start;
      padding: 1.5rem;
      border: 1px solid #2a394d;
      border-radius: 18px;
      background: linear-gradient(145deg, rgb(31 47 67 / 92%), rgb(22 33 49 / 92%));
      text-decoration: none;
      transition: border-color .18s ease, transform .18s ease;
    }

    .project:hover, .project:focus-visible {
      transform: translateY(-3px);
      border-color: #75d6c3;
      outline: none;
    }

    .project-tag {
      margin: 0 0 1.25rem;
      color: #75d6c3;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .project h3 {
      margin: 0 0 .65rem;
      font-size: 1.35rem;
    }

    .project p {
      margin: 0;
      color: #aab8ca;
      line-height: 1.6;
    }

    .visit {
      margin-top: auto;
      padding-top: 1.5rem;
      color: #dffaf3;
      font-size: .9rem;
      font-weight: 650;
    }

    footer {
      margin-top: 5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #2a394d;
      color: #8493a8;
      font-size: .85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Ritwik's corner of the web</p>
    <h1>Websites &amp; projects</h1>
    <p class="intro">A home for the websites I build. Pick a project below to explore it.</p>

    <section aria-labelledby="projects-heading">
      <h2 class="section-heading" id="projects-heading">Featured</h2>
      <div class="projects">
        <a class="project" href="https://ritwikcodes.github.io/FWD.023/">
          <p class="project-tag">Student platform</p>
          <h3>ProfLine</h3>
          <p>Check faculty availability, browse class topics, and send doubt requests.</p>
          <span class="visit">Visit ProfLine <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>

    <footer>More projects can be added here as they go live.</footer>
  </main>
</body>
</html>
